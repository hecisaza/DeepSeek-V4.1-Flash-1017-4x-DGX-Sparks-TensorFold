# spark-test: test a pull request on the lab's Sparks against its base (main without the PR), with the inference-agent-kit.
# Both builds get the lab's local.sh without engine settings, so each runs with its own defaults. Three ways in:
#   - the label `test` on a PR of this repository (authors in the allowlist below)
#   - "Run workflow" with a PR number here, or the URL of a PR anywhere (for example the upstream recipe)
#   - called by spark-issue after its agent opened a PR
# A PR that carries tests/repro-issue-N.sh also gets the repro suite: the script must show the problem on the base and
# not on the PR. Evidence is committed to the PR branch and posted as a comment when the PR lives here; for a PR elsewhere
# it goes to an evidence/ branch here and to the run summary, and nothing is posted on the other repository.
name: spark-test

on:
  pull_request_target:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number in this repository, or the URL of a PR anywhere"
        required: true
        type: string
      suites:
        description: "suites to run (default: the SUITES variable, else smoke,boundary,cutin,perf,soak)"
        required: false
        type: string
      reps:
        description: "repetitions (default 1; 2 = counterbalanced PR/base then base/PR, twice the lab time)"
        required: false
        type: string
      attempt:
        description: "set by the verify step when it reruns a PR with a claim test (2); leave empty"
        required: false
        type: string
  workflow_call:
    inputs:
      pr:
        required: true
        type: string
      suites:
        required: false
        type: string
      reps:
        required: false
        type: string
      attempt:
        required: false
        type: string
      called:
        required: false
        type: boolean
        default: true

permissions:
  contents: write        # evidence commits, claims/
  pull-requests: write   # the automated comment, the evidence: label
  actions: write         # the verify job dispatches attempt 2

jobs:
  test:
    # a labelled PR runs only for allowed authors; a dispatch or a call was started by someone with write access
    if: >-
      github.event_name != 'pull_request_target' ||
      (contains(github.event.pull_request.labels.*.name, 'test') &&
       contains(fromJSON('["hecisaza"]'), github.event.pull_request.user.login))
    runs-on: [self-hosted, spark-lab]
    timeout-minutes: 240
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      claim: ${{ steps.test.outputs.claim }}
      pr_url: ${{ steps.verdict.outputs.pr_url }}
      pr_repo: ${{ steps.verdict.outputs.pr_repo }}
      pr: ${{ steps.verdict.outputs.pr }}
      suites: ${{ steps.verdict.outputs.suites }}
      reps: ${{ steps.verdict.outputs.reps }}
    # no concurrency group: the one runner with the spark-lab label runs one job at a time, and GitHub keeps every job
    # queued until it is free (a concurrency group keeps only one pending run and cancels the others)
    env:
      KIT: /root/inference-agent-kit
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      THIS_REPO: ${{ github.repository }}
      PR_INPUT: ${{ inputs.pr || github.event.pull_request.number }}
      SUITES: ${{ inputs.suites || vars.SUITES || 'smoke,boundary,cutin,perf,soak' }}
      REPS: ${{ inputs.reps || vars.REPS || '1' }}
    steps:
      - name: Resolve the pull request
        run: |
          if [[ "$PR_INPUT" =~ ^https://github\.com/([^/]+/[^/]+)/pull/([0-9]+) ]]; then PR_REPO=${BASH_REMATCH[1]}; PR=${BASH_REMATCH[2]}
          else PR_REPO=$THIS_REPO; PR=$PR_INPUT; fi
          { echo "PR_REPO=$PR_REPO"; echo "PR=$PR"
            gh pr view "$PR" -R "$PR_REPO" --json headRefOid,baseRefOid,headRefName,baseRefName,isCrossRepository,url,mergeable,potentialMergeCommit \
              --jq '"HEAD_SHA=\(.headRefOid)\nBASE_SHA=\(.baseRefOid)\nHEAD_REF=\(.headRefName)\nBASE_REF=\(.baseRefName)\nPR_URL=\(.url)\nCROSS=\(.isCrossRepository)\nMERGEABLE=\(.mergeable)\nMERGE_SHA=\(.potentialMergeCommit.oid // "")"'
          } | tee -a "$GITHUB_ENV"
          # evidence goes to the PR branch only when that branch lives in this repository
          if [ "$PR_REPO" = "$THIS_REPO" ] && grep -q "^CROSS=false" "$GITHUB_ENV"; then echo "EVIDENCE_REF=$(grep ^HEAD_REF= "$GITHUB_ENV" | tail -1 | cut -d= -f2-)" >> "$GITHUB_ENV"
          else echo "EVIDENCE_REF=evidence/$(tr / - <<<"$PR_REPO")-pr-$PR" >> "$GITHUB_ENV"; fi

      - name: Checkout the candidate (the PR merged onto its current base) and the base
        run: |
          find . -mindepth 1 -delete; rm -rf ../base
          git init -q .
          if [ -n "$MERGE_SHA" ]; then
            # the candidate is GitHub's test merge of the PR onto the current base: exactly the PR's change on today's main
            git fetch -q "https://github.com/$PR_REPO.git" "refs/pull/$PR/merge" "refs/pull/$PR/head" "$BASE_SHA"
            CAND_SHA=$MERGE_SHA; CAND_KIND="merged onto the current base"
          else
            # no clean merge: the head against the commit it branched from, so the difference is still the PR's change alone
            git fetch -q "https://github.com/$PR_REPO.git" "refs/pull/$PR/head:refs/remotes/pr/head" "refs/heads/$BASE_REF:refs/remotes/pr/base"
            BASE_SHA=$(git merge-base refs/remotes/pr/head refs/remotes/pr/base); CAND_SHA=$HEAD_SHA
            CAND_KIND="head against its merge-base ${BASE_SHA::8} (the PR does not merge cleanly onto the current base)"
          fi
          { echo "CAND_SHA=$CAND_SHA"; echo "BASE_SHA=$BASE_SHA"; echo "CAND_KIND=$CAND_KIND"; } >> "$GITHUB_ENV"
          git checkout -q "$CAND_SHA"
          mkdir -p ../base && git archive "$BASE_SHA" | tar -x -C ../base
          echo "PR $PR_URL: head ${HEAD_SHA::8} ($HEAD_REF) $CAND_KIND; candidate ${CAND_SHA::8}, base ${BASE_SHA::8} ($BASE_REF)"

      - name: Upstream state (stage 0, on the repository the PR belongs to)
        run: |
          "$KIT/scripts/sync.sh" "$PR_REPO" | tee sync.txt

      - name: Build the PR and its base on the build host and ship both images to every Spark
        id: build
        run: |
          IMAGE="tensorfold-dsv41:pr-${CAND_SHA::8}"; BASE_IMAGE="tensorfold-dsv41:base-${BASE_SHA::8}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"; echo "BASE_IMAGE=$BASE_IMAGE" >> "$GITHUB_ENV"
          # the base (main without the PR) is the control; the lab's local.sh goes to both checkouts without its engine
          # settings (TF_* lines), so the PR's defaults and the base's defaults are what runs
          ssh -o BatchMode=yes hisaza@192.168.1.123 "grep -vE '^[[:space:]]*(export[[:space:]]+)?TF_' ~/ds41-4x/scripts/local.sh" > local.lab.sh
          for pair in "./:ds41-pr" "../base/:ds41-base"; do
            src=${pair%%:*}; dir=${pair##*:}
            rsync -a --delete --exclude .git "$src" hisaza@192.168.1.161:$dir/
            rsync -a --delete --exclude .git "$src" hisaza@192.168.1.123:$dir/
            scp -q local.lab.sh hisaza@192.168.1.123:$dir/scripts/local.sh
          done
          sed "s#__PR_IMAGE__#$IMAGE#; s#__BASE_IMAGE__#$BASE_IMAGE#" "$KIT/lab.pipeline.yaml" > lab.run.yaml
          "$KIT/scripts/pairtest" build --lab lab.run.yaml --target base
          "$KIT/scripts/pairtest" build --lab lab.run.yaml --target pr

      - name: Test the PR against its base (stage 3)
        id: test
        run: |
          # a PR that fixes an issue carries its reproduction script; otherwise a claim test written by the verify step may
          # exist under claims/ on this repository's main. Either runs against both builds as the repro suite.
          R=$(ls tests/repro-issue-*.sh 2>/dev/null | head -1); OPTS=(); S="$SUITES"
          SLUG=$(tr / - <<<"$PR_REPO")
          if [ -z "$R" ] && gh api "repos/$THIS_REPO/contents/claims/$SLUG-pr-$PR.sh?ref=main" -H "Accept: application/vnd.github.raw" > claim.sh 2>/dev/null && [ -s claim.sh ]; then
            echo "claim test found on main: claims/$SLUG-pr-$PR.sh"; R=claim.sh
          else rm -f claim.sh; fi
          echo "claim=$([ "$R" = claim.sh ] && echo yes || echo none)" >> "$GITHUB_OUTPUT"
          if [ -n "$R" ]; then OPTS=(--opt "repro_cmd=bash $R {api} {model}"); case ",$S," in *,repro,*) ;; *) S="$S,repro";; esac; fi
          echo "SUITES_RUN=$S" >> "$GITHUB_ENV"
          "$KIT/scripts/pairtest" run --lab lab.run.yaml --target pr --compare base --suite "$S" --runs runs --opt "reps=$REPS" "${OPTS[@]}"

      - name: Restore the live server (belt and braces)
        if: always()
        run: |
          "$KIT/scripts/pairtest" restore --lab lab.run.yaml

      - name: Second opinion on the evidence (a different model, read-only; never fails the run)
        if: always() && steps.test.outcome != 'skipped'
        timeout-minutes: 30
        run: |
          RUN=$(ls -t runs 2>/dev/null | head -1); [ -n "$RUN" ] || exit 0
          gh pr view "$PR" -R "$PR_REPO" --json title,body --jq '"\(.title)\n\n\(.body)"' > pr.md || true
          "$KIT/scripts/evidence-review.sh" "runs/$RUN" --checkout . --base "$BASE_SHA" --head "$CAND_SHA" --pr-url "$PR_URL" --pr-file pr.md --timeout 25 || true

      - name: Merge readiness (computed from the results, the second opinion and the open PRs; a person merges)
        id: verdict
        if: always() && steps.test.outcome != 'skipped'
        run: |
          RUN=$(ls -t runs 2>/dev/null | head -1); [ -n "$RUN" ] || exit 0
          "$KIT/scripts/verdict.py" "runs/$RUN" --review "runs/$RUN/REVIEW.md" --sync sync.txt --pr "$PR" --pr-file pr.md || true
          CLS=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['class'])" "runs/$RUN/verdict.json" 2>/dev/null || echo "")
          { echo "verdict=$CLS"; echo "pr_url=$PR_URL"; echo "pr_repo=$PR_REPO"; echo "pr=$PR"; echo "suites=$SUITES"; echo "reps=$REPS"; } >> "$GITHUB_OUTPUT"
          # the class as a label, on PRs of this repository only
          if [ "$PR_REPO" = "$THIS_REPO" ] && [ -s "runs/$RUN/verdict.json" ]; then
            L=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['label'])" "runs/$RUN/verdict.json")
            for x in evidence:ready evidence:unverified evidence:blocked evidence:rerun; do [ "$x" = "$L" ] || gh pr edit "$PR" -R "$THIS_REPO" --remove-label "$x" >/dev/null 2>&1 || true; done
            gh pr edit "$PR" -R "$THIS_REPO" --add-label "$L" >/dev/null 2>&1 || true
          fi

      - name: Evidence to the PR branch (or an evidence/ branch here for a PR elsewhere)
        if: always()
        run: |
          RUN=$(ls -t runs 2>/dev/null | head -1); [ -n "$RUN" ] || exit 0
          echo "RUN=$RUN" >> "$GITHUB_ENV"
          git checkout -q --detach "$HEAD_SHA" 2>/dev/null || true   # the evidence commit sits on the PR head, not on the test merge
          mkdir -p "docs/evidence/$RUN"
          cp "runs/$RUN/report.md" "runs/$RUN/report.html" "docs/evidence/$RUN/" 2>/dev/null || true
          cp runs/"$RUN"/*.svg "docs/evidence/$RUN/" 2>/dev/null || true
          cp "runs/$RUN/REVIEW.md" "runs/$RUN/VERDICT.md" "docs/evidence/$RUN/" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence
          git commit -q -m "evidence: $RUN (automated test run of $PR_URL)" || exit 0
          case "$EVIDENCE_REF" in evidence/*) FORCE=--force;; *) FORCE=;; esac
          git push -q $FORCE "https://x-access-token:$GH_TOKEN@github.com/$THIS_REPO.git" "HEAD:refs/heads/$EVIDENCE_REF"
          echo "evidence: https://github.com/$THIS_REPO/tree/$EVIDENCE_REF/docs/evidence/$RUN"

      - name: Comment on the PR (here), or write the comment to the run summary (a PR elsewhere)
        if: always()
        run: |
          [ -n "${RUN:-}" ] || RUN=$(ls -t runs 2>/dev/null | head -1)
          STATUS="${{ steps.test.outcome }}"
          [ "${{ steps.build.outcome }}" = failure ] && STATUS="build failed (nothing was tested)"
          {
            echo "**Automated test run** on the lab's Sparks: $PR_URL, \`${HEAD_SHA::8}\` ${CAND_KIND:-against its base} vs base \`${BASE_SHA::8}\`, suites ${SUITES_RUN:-$SUITES}: **$STATUS** (job [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))"
            echo
            if [ -n "$RUN" ] && [ -s "runs/$RUN/VERDICT.md" ]; then cat "runs/$RUN/VERDICT.md"; echo; fi
            if [ -n "$RUN" ] && [ -f "runs/$RUN/report.md" ]; then sed -n '1,200p' "runs/$RUN/report.md"; else echo "_no report was produced; see the job log_"; fi
            echo
            if [ -n "$RUN" ] && [ -s "runs/$RUN/REVIEW.md" ]; then
              echo "### Second opinion (Codex, read-only, from the diff, the report and the raw results)"; echo; sed -n '1,120p' "runs/$RUN/REVIEW.md"; echo
            elif [ -n "$RUN" ] && [ -s "runs/$RUN/review-missing.txt" ]; then
              echo "_No second opinion this run: $(cat "runs/$RUN/review-missing.txt")_"; echo
            fi
            if [ -n "$RUN" ]; then echo "_Full evidence: [docs/evidence/$RUN/](https://github.com/$THIS_REPO/tree/$EVIDENCE_REF/docs/evidence/$RUN) (report.html, charts). Posted by the spark-test workflow._"; else echo "_Posted by the spark-test workflow._"; fi
          } > comment.md
          if [ "$PR_REPO" = "$THIS_REPO" ]; then gh pr comment "$PR" -R "$THIS_REPO" --body-file comment.md
          else { echo "The PR is in $PR_REPO: nothing was posted there. The comment, ready to paste:"; echo; cat comment.md; } >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Keep the report and the comment as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-test-${{ github.run_id }}
          path: |
            comment.md
            claim.sh
            runs/*/report.md
            runs/*/report.html
            runs/*/results.json
            runs/*/*.svg
            runs/*/REVIEW.md
            runs/*/review-missing.txt
            runs/*/VERDICT.md
            runs/*/verdict.json
            runs/*/review/pr.patch
            runs/*/review/PR.md
          if-no-files-found: ignore

      - name: Remove older PR and base images from the Sparks
        if: always()
        run: |
          for h in 192.168.1.123 192.168.1.161 192.168.1.197 192.168.1.113; do
            ssh -o BatchMode=yes hisaza@$h "docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '^tensorfold-dsv41:(pr|base)-' | grep -vE \"^($IMAGE|$BASE_IMAGE)\$\" | xargs -r docker image rm -f >/dev/null 2>&1 || true"
          done

  verify:
    # SAFE, UNVERIFIED on the first attempt: an agent writes the claim test the suites lacked, it must fail on the base,
    # it is committed under claims/ on main and the pipeline reruns this PR with it (attempt 2, the cap: no loop)
    needs: test
    if: always() && needs.test.result == 'success' && needs.test.outputs.verdict == 'SAFE, UNVERIFIED' && needs.test.outputs.claim == 'none' && (inputs.attempt || '1') == '1'
    runs-on: [self-hosted, spark-lab]
    timeout-minutes: 90
    env:
      KIT: /root/inference-agent-kit
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      THIS_REPO: ${{ github.repository }}
      LIVE_API: http://192.168.1.123:8888/v1
      LIVE_MODEL: DeepSeek-V4.1-Flash-1017
      PR_URL: ${{ needs.test.outputs.pr_url }}
      PR_REPO: ${{ needs.test.outputs.pr_repo }}
      PR: ${{ needs.test.outputs.pr }}
      SUITES: ${{ needs.test.outputs.suites }}
      REPS: ${{ needs.test.outputs.reps }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spark-test-${{ github.run_id }}
          path: art

      - name: An agent writes the claim test the suites lacked; it must fail on the base before it is accepted
        id: claim
        run: |
          RUN=$(ls -t art/runs | head -1)
          "$KIT/scripts/claim-agent.sh" "art/runs/$RUN" --pr-url "$PR_URL" --out claim.sh 2>&1 | tee claim-run.txt
          R=$(grep -o 'RESULT: .*' claim-run.txt | tail -1); echo "verify: ${R:-no result}" >> "$GITHUB_STEP_SUMMARY"
          case "$R" in "RESULT: claim "*) echo "ok=yes" >> "$GITHUB_OUTPUT";; *) echo "ok=no" >> "$GITHUB_OUTPUT";; esac

      - name: Keep the agent's attempt (task, rounds, base run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-${{ github.run_id }}
          path: art/runs/*/claim/**
          if-no-files-found: ignore

      - name: Commit the claim test under claims/ on main and rerun the pipeline with it (attempt 2)
        if: steps.claim.outputs.ok == 'yes'
        run: |
          rm -rf fork && git clone -q --depth 1 "https://x-access-token:$GH_TOKEN@github.com/$THIS_REPO.git" fork
          SLUG=$(tr / - <<<"$PR_REPO"); mkdir -p fork/claims; cp claim.sh "fork/claims/$SLUG-pr-$PR.sh"
          git -C fork config user.name "github-actions[bot]"
          git -C fork config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C fork add claims
          git -C fork commit -q -m "claims: $SLUG-pr-$PR.sh, the claim test written by the verify step for $PR_URL"
          git -C fork push -q origin HEAD:main
          gh workflow run spark-test.yml -R "$THIS_REPO" -f "pr=$PR_URL" -f "attempt=2" ${SUITES:+-f "suites=$SUITES"} ${REPS:+-f "reps=$REPS"}
          echo "claim committed as claims/$SLUG-pr-$PR.sh; attempt 2 dispatched" >> "$GITHUB_STEP_SUMMARY"
